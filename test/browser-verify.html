<!doctype html>
<!--
  브라우저 실제 렌더 하네스 (참고용, npm test 에는 포함되지 않음)

  5개 탭 렌더러를 진짜 브라우저에서 실행하고, 동작 탭의 이벤트 칩을 하나씩
  클릭해 렌더된 연쇄를 콘솔에 찍습니다. DOM 을 실제로 만드는 코드까지 검증합니다.

  실행:
    npx vite &
    "<Chrome 경로>" --headless --disable-gpu --virtual-time-budget=6000 \
      --dump-dom "http://localhost:5173/test/browser-verify.html"
  또는 그냥 브라우저에서 http://localhost:5173/test/browser-verify.html 를 열고
  콘솔(F12)을 확인하세요.
-->
<html><head><meta charset="utf-8"><title>browser verify</title></head><body>
<div id="out" style="font-family:monospace; white-space:pre-wrap; overflow-wrap:anywhere; padding:16px"></div>
<script type="module">
import { parseCode } from '../src/core/parser.js'
import { renderHighlightView } from '../src/core/highlighter.js'
import { calculateMetrics, renderMetricsView } from '../src/core/metrics.js'
import { renderFlowView } from '../src/core/flow.js'
import { renderStructureView } from '../src/ui/structure.js'
import { parseBehavior } from '../src/core/behavior/index.js'
import { renderBehaviorView } from '../src/ui/behavior.js'

const code = `import { useState, useEffect, useCallback, memo } from 'react'
import { fetchPosts } from './api'

export default function UserDashboard({ userId, onLogout }) {
  const [tab, setTab] = useState('profile')
  const [posts, setPosts] = useState([])
  useEffect(() => {
    if (tab !== 'posts') return
    fetchPosts(userId).then(setPosts)
  }, [tab, userId])
  const handleSelect = useCallback((next) => { setTab(next) }, [])
  return (
    <nav>
      <button onClick={onLogout}>logout</button>
      <button onClick={() => handleSelect('posts')}>posts</button>
      {tab === 'profile' && <Profile />}
    </nav>
  )
}
const Profile = memo(() => <section>profile</section>)
`

const out = document.getElementById('out')
const log = (t) => { out.textContent += t + '\n' }

try {
  const analysis = parseCode(code)
  // 5개 탭 렌더러 실제 실행 — throw 하면 catch 로
  renderHighlightView(code, analysis, 'jsx')
  renderStructureView(analysis, () => {})
  renderMetricsView(calculateMetrics(analysis), () => {})
  renderFlowView(analysis, () => {})
  const be = renderBehaviorView(parseBehavior(code), () => {})
  document.body.appendChild(be)

  log('RESULT_OK: true')
  const chips = [...be.querySelectorAll('.behavior-chip')]
  log('behavior events: ' + chips.length)
  chips.forEach((chip, i) => {
    chip.click()
    // 대기 구간은 .behavior-step 이 아닌 .behavior-wait 로 그려집니다 — 높이까지 함께 봅니다
    const rows = [...be.querySelectorAll('.behavior-detail .behavior-step, .behavior-detail .behavior-wait')]
    const steps = rows.map(s =>
      s.classList.contains('behavior-wait')
        ? `대기:${s.textContent.replace(/\s+/g, ' ').trim()} [높이 ${s.style.minHeight}]`
        : (s.querySelector('.behavior-step__kind')?.textContent || '') + ':' +
          (s.querySelector('.behavior-step__label')?.textContent || '').replace(/\s+/g, ' ').trim())
    log(`  event ${i + 1}: ` + steps.join('  →  '))
  })
  // 연쇄의 관문 — 번호를 먹지 않고(↩), 설명은 알약 안에만(화살표에 중복 금지)
  const gateRow = [...be.querySelectorAll('.behavior-detail .behavior-step--gate')][0]
  if (gateRow) {
    const nums = [...be.querySelectorAll('.behavior-detail .behavior-step__num')]
      .map(n => n.textContent.trim())
    const connNotes = [...be.querySelectorAll('.behavior-detail .behavior-connector__note')]
      .map(n => n.textContent.trim())
    log('연쇄 관문: 표시 "' + gateRow.querySelector('.behavior-step__num').textContent.trim() +
      '" / 설명 "' + (gateRow.querySelector('.behavior-step__hint')?.textContent.trim() || '없음') + '"')
    log('  스텝 번호: ' + nums.join(' ') + '  (번호가 안 건너뛰어야 함)')
    log('  화살표에 관문 설명 중복: ' +
      connNotes.filter(t => t.includes('아래 단계는')).length + '건 (0 이어야 함)')
  } else {
    log('연쇄 관문: 없음 (있어야 함!)')
  }
  // ⏱ 타이밍 · deps 점검 — 트랙 머리말/경고가 실제로 그려지는지 봅니다
  const staleCode = `import { useState, useEffect } from 'react'

export default function Ticker({ userId }) {
  const [count, setCount] = useState(0)
  const [user, setUser] = useState(null)
  useEffect(() => {
    fetchUser(userId).then((u) => setUser(u))
  }, [])
  useEffect(() => {
    const t = setInterval(() => setCount(count + 1), 1000)
    return () => clearInterval(t)
  }, [])
  return <div onClick={() => setCount(0)}>{count}</div>
}
`
  const be2 = renderBehaviorView(parseBehavior(staleCode), () => {})
  document.body.appendChild(be2)
  const tracks = [...be2.querySelectorAll('.timing-track')]
  log('timing tracks: ' + tracks.length)
  log('timing title: ' + (be2.querySelector('.behavior-timing__title')?.textContent || '').replace(/\s+/g, ' ').trim())
  tracks.forEach((t, i) => {
    const when = t.querySelector('.timing-track__when')?.textContent || ''
    const chip = t.querySelector('.timing-track__stale')?.textContent || '(빠짐 없음)'
    const warns = [...t.querySelectorAll('.timing-warn__label')].map(w => w.textContent).join(' / ')
    log(`  track ${i + 1}: ${when} | ${chip} | ${warns || '(경고 없음)'}`)
  })
  // 🔗 Effect 사이 관계 — 연쇄/루프/경합 카드가 실제로 그려지는지 봅니다
  const raceCode = `import { useState, useEffect } from 'react'

export default function Board({ query }) {
  const [items, setItems] = useState([])
  const [page, setPage] = useState(1)
  const [total, setTotal] = useState(0)
  useEffect(() => {
    fetchItems(query, page).then((res) => { setItems(res.list); setTotal(res.total) })
  }, [query, page])
  useEffect(() => {
    setItems(items.filter(Boolean))
  }, [items])
  useEffect(() => {
    setPage(1)
  }, [total])
  useEffect(() => {
    setTotal(items.length)
  })
  return <div onClick={() => setPage(page + 1)}>{items.length}</div>
}
`
  const be3 = renderBehaviorView(parseBehavior(raceCode), () => {})
  document.body.appendChild(be3)
  log('interplay title: ' + (be3.querySelector('.behavior-interplay .behavior-timing__title')?.textContent || '').replace(/\s+/g, ' ').trim())
  const cards = [...be3.querySelectorAll('.interplay-card')]
  log('interplay cards: ' + cards.length)
  cards.forEach((c, i) => {
    const kind = c.querySelector('.interplay-card__kind')?.textContent || ''
    const label = c.querySelector('.interplay-card__label')?.textContent || ''
    const pills = [...c.querySelectorAll('.timing-pill')].map(p => p.textContent.replace(/\s+/g, ' ').trim())
    log(`  card ${i + 1}: [${kind}] ${label}`)
    log(`      ${pills.join('  ·  ')}`)
  })
  // ⏱ 상대 시간감 — 기다리는 구간만 실제로 넓게 그려지는지 봅니다
  const waitCode = `import { useState, useEffect } from 'react'

export default function Slow({ id }) {
  const [user, setUser] = useState(null)
  const [ready, setReady] = useState(false)
  useEffect(() => {
    setReady(false)
    fetchUser(id).then(setUser)
  }, [id])
  useEffect(() => {
    async function warmup() {
      await sleep(3000)
      setReady(true)
    }
    warmup()
  }, [])
  return <div>{user}</div>
}
`
  const be4 = renderBehaviorView(parseBehavior(waitCode), () => {})
  document.body.appendChild(be4)
  const waitTracks = [...be4.querySelectorAll('.timing-track')]
  log('wait tracks: ' + waitTracks.length)
  waitTracks.forEach((t, i) => {
    const pills = [...t.querySelectorAll('.timing-pill')].map(p => {
      const w = p.style.minWidth
      return p.textContent.replace(/\s+/g, ' ').trim() + (w ? ` [폭 ${w}]` : '')
    })
    log(`  wait track ${i + 1}: ` + pills.join('  ·  '))
  })
  // ⏱ 조건부 실행 — 관문(gate) 알약이 흐름 안 제자리에 그려지는지 봅니다
  const gateCode = `import { useState, useEffect } from 'react'

export default function Panel({ tab, id }) {
  const [posts, setPosts] = useState([])
  const [loading, setLoading] = useState(false)
  useEffect(() => {
    setLoading(true)
    if (tab !== 'posts') return
    fetchPosts(id).then(setPosts)
  }, [tab, id])
  useEffect(() => {
    let alive = true
    async function load() {
      if (!id) return
      const p = await fetchPosts(id)
      if (!alive) return
      setPosts(p)
    }
    load()
    return () => { alive = false }
  }, [id])
  return <div onClick={() => setLoading(false)}>{posts.length}</div>
}
`
  const be5 = renderBehaviorView(parseBehavior(gateCode), () => {})
  document.body.appendChild(be5)
  const gateTracks = [...be5.querySelectorAll('.timing-track')]
  log('gate tracks: ' + gateTracks.length)
  gateTracks.forEach((t, i) => {
    const pills = [...t.querySelectorAll('.timing-pill')].map(p =>
      (p.classList.contains('timing-pill--gate') ? '⟨관문⟩ ' : '') +
      p.textContent.replace(/\s+/g, ' ').trim())
    log(`  gate track ${i + 1}: ` + pills.join('  ·  '))
  })
  const gatePills = [...be5.querySelectorAll('.timing-pill--gate')]
  log('관문 알약: ' + gatePills.length + '개 / 설명 붙은 것 ' +
    gatePills.filter(p => p.getAttribute('aria-label')).length + '개')

  // 🪝 커스텀 훅 경계 — 흐름이 훅 안으로 들어갔다 나오는 구역이 그려지는지 봅니다
  const hookCode = `import { useState, useEffect } from 'react'

function useSearch() {
  const [query, setQuery] = useState('')
  const [hits, setHits] = useState([])
  useEffect(() => {
    search(query).then(setHits)
  }, [query])
  return { query, setQuery, hits }
}

function useToggle() {
  const [on, setOn] = useState(false)
  return [on, setOn]
}

function useSelection() {
  const [sel, setSel] = useState(null)
  const onSelect = (id) => { setSel(id) }
  return { sel, onSelect }
}

export default function Panel() {
  const { setQuery, hits } = useSearch()
  const [open, toggle] = useToggle()
  const { onSelect: pick } = useSelection()
  const [tab, setTab] = useState('a')
  return (
    <div>
      <input onChange={(e) => setQuery(e.target.value)} />
      <button onClick={() => toggle(true)}>t</button>
      <button onClick={pick}>s</button>
      <button onClick={() => setTab('b')}>b</button>
    </div>
  )
}
`
  const be6 = renderBehaviorView(parseBehavior(hookCode), () => {})
  document.body.appendChild(be6)
  const hookChips = [...be6.querySelectorAll('.behavior-chip')]
  log('hook events: ' + hookChips.length)
  hookChips.forEach((chip, i) => {
    chip.click()
    const zones = [...be6.querySelectorAll('.behavior-detail .behavior-hookzone')]
    const head = zones.map(z =>
      (z.querySelector('.behavior-hookzone__head')?.textContent || '').replace(/\s+/g, ' ').trim())
    const inside = zones.map(z =>
      [...z.querySelectorAll('.behavior-step, .behavior-wait')].map(s => {
        const label = (s.querySelector('.behavior-step__label') || s).textContent.replace(/\s+/g, ' ').trim()
        // 이름을 바꿔 받았으면 훅 안에서 찾을 이름을 함께 적어 줍니다
        const hint = s.querySelector('.behavior-step__hint')
        return label + (hint ? ` (${hint.textContent.replace(/\s+/g, ' ').trim()})` : '')
      }).join(' → '))
    // 구역 밖(컴포넌트)에 남은 스텝 — 이벤트로 시작해 리렌더로 끝나야 합니다
    const outside = [...be6.querySelectorAll('.behavior-detail .behavior-flow > .behavior-step')]
      .map(s => (s.querySelector('.behavior-step__label')?.textContent || '').replace(/\s+/g, ' ').trim())
    log(`  hook event ${i + 1}: 구역 ${zones.length}개`)
    head.forEach((h, k) => log(`      [${h}]  ${inside[k]}`))
    log('      구역 밖: ' + outside.join(' → '))
  })
  // 마지막 칩에는 구역이 없으므로, 구역이 있는 첫 칩으로 돌아와 세야 합니다
  hookChips[0].click()
  const zoneHeads = [...be6.querySelectorAll('.behavior-detail .behavior-hookzone__head')]
  log('훅 구역 머리말: ' + zoneHeads.length + '개 / 훅 선언으로 이동 가능한 것 ' +
    zoneHeads.filter(h => h.classList.contains('is-clickable')).length + '개')

  // 🔗 관계 카드가 "이 Effect 는 훅 안에 있다" 를 함께 보여주는지
  const hookLoopCode = `import { useState, useEffect } from 'react'

function useCounter() {
  const [count, setCount] = useState(0)
  useEffect(() => {
    setCount(count + 1)
  }, [count])
  return count
}

export default function Panel() {
  const count = useCounter()
  return <div>{count}</div>
}
`
  const be7 = renderBehaviorView(parseBehavior(hookLoopCode), () => {})
  document.body.appendChild(be7)
  const loopCard = be7.querySelector('.interplay-card')
  log('훅 안의 루프 카드: ' + (loopCard
    ? [...loopCard.querySelectorAll('.timing-pill')]
        .map(p => p.textContent.replace(/\s+/g, ' ').trim()).join('  ·  ')
    : '(없음)'))
  log('  ⏱ 트랙 머리말: ' + [...be7.querySelectorAll('.timing-track__head')]
    .map(h => h.textContent.replace(/\s+/g, ' ').trim()).join(' | '))

  // 붙여넣은 코드가 HTML 로 해석되지 않는지 — `<button onClick>` 라벨이 진짜
  // 엘리먼트로 렌더되면 스텝이 깨집니다. 라벨 안에는 span 말고 아무것도 없어야 합니다.
  const labels = [...document.querySelectorAll('.behavior-step__label')]
  const injected = labels.filter(l => [...l.querySelectorAll('*')].some(n => n.tagName !== 'SPAN'))
  log('라벨 HTML 주입: ' + injected.length + '건 (0 이어야 함)')
  log('  라벨 예시: ' + labels.slice(0, 3).map(l => JSON.stringify(l.textContent.trim())).join(', '))

  // 좁은 화면에서 가로 스크롤이 생기지 않는지 — 대기 알약/카드가 넓어졌으므로
  const de = document.documentElement
  log('가로 넘침: ' + (de.scrollWidth - de.clientWidth) + 'px (문서 폭 ' + de.clientWidth + 'px)')
} catch (err) {
  log('RESULT_OK: false\n' + err.stack)
}
document.title = 'VERIFY_DONE'
</script></body></html>
