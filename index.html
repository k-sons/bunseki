<!DOCTYPE html>
<html lang="ko" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bunseki — 코드 가독성 분석</title>
  <meta name="description" content="React/React Native 코드를 붙여넣으면 구조를 시각적으로 분석해주는 개발자 도구" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Prism.js 는 src/core/highlighter.js 에서 번들로 로드됩니다 (CDN 의존 없음) -->

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/styles/index.css" />
</head>

<body>
  <!-- Header -->
  <header id="app-header" class="header">
    <div class="header__brand">
      <div class="header__logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="2" y="2" width="24" height="24" rx="6" stroke="url(#logo-grad)" stroke-width="2.5" />
          <path d="M8 10h4M8 14h8M8 18h6" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" />
          <circle cx="20" cy="10" r="2" fill="url(#logo-grad)" />
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28">
              <stop stop-color="#818cf8" />
              <stop offset="1" stop-color="#c084fc" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="header__title">bunseki</h1>
      <span class="header__badge">React / RN</span>
    </div>
    <div class="header__actions">
      <button id="btn-clear" class="btn btn--ghost" title="코드 초기화 (Clear)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path fill-rule="evenodd"
            d="M5.5 5.5A.5.5 0 016 6v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm2.5 0a.5.5 0 01.5.5v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm3 .5a.5.5 0 00-1 0v6a.5.5 0 001 0V6z" />
          <path fill-rule="evenodd"
            d="M14.5 3a1 1 0 01-1 1H13v9a2 2 0 01-2 2H5a2 2 0 01-2-2V4h-.5a1 1 0 01-1-1V2a1 1 0 011-1H6a1 1 0 011-1h2a1 1 0 011 1h3.5a1 1 0 011 1v1zM4.118 4L4 4.059V13a1 1 0 001 1h6a1 1 0 001-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z" />
        </svg>
        지우기
      </button>
      <button id="btn-export" class="btn btn--ghost" title="마크다운으로 추출 복사">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M11.5 2h-7A1.5 1.5 0 003 3.5v9A1.5 1.5 0 004.5 14h7a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0011.5 2zM8 12.5a.5.5 0 01-.5-.5v-4.8l-1.15 1.15a.5.5 0 01-.7-.7l2-2a.5.5 0 01.7 0l2 2a.5.5 0 01-.7.7L8.5 7.2v4.8a.5.5 0 01-.5.5z" />
        </svg>
        Export
      </button>
      <button id="btn-example" class="btn btn--ghost" title="예제 코드 로드">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M4 1h8a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V3a2 2 0 012-2zm0 1.5a.5.5 0 00-.5.5v10a.5.5 0 00.5.5h8a.5.5 0 00.5-.5V3a.5.5 0 00-.5-.5H4zM5 5h6v1H5V5zm0 2.5h6v1H5v-1zm0 2.5h4v1H5V10z" />
        </svg>
        예제
      </button>
      <button id="btn-analyze" class="btn btn--primary" title="코드 분석 실행 (Ctrl+Enter)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M10.804 8L5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 010 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z" />
        </svg>
        실행
      </button>
      <button id="btn-theme" class="btn btn--icon" title="테마 전환" aria-label="테마 전환">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
          <path d="M7.5 1.5a7 7 0 109.128 8.628A5.5 5.5 0 017.5 1.5z" />
        </svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 18 18" fill="currentColor" style="display:none">
          <circle cx="9" cy="9" r="3.5" />
          <path
            d="M9 1v2M9 15v2M1 9h2M15 9h2M3.34 3.34l1.42 1.42M13.24 13.24l1.42 1.42M3.34 14.66l1.42-1.42M13.24 4.76l1.42-1.42"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <main id="app-main" class="main">
    <!-- Left: Code Input -->
    <section id="panel-input" class="panel panel--input" aria-label="코드 입력">
      <div class="panel__header">
        <span class="panel__label">코드 입력</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="btn-clear-editor" class="btn-text-ghost" title="코드 전체 지우기">지우기</button>
          <select id="select-lang" class="select select--lang" aria-label="언어 선택">
            <option value="jsx" selected>JSX / React</option>
            <option value="tsx">TSX / TypeScript</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
          </select>
        </div>
      </div>
      <div class="editor-wrap">
        <div class="editor-lines" id="editor-lines" aria-hidden="true"></div>
        <div class="editor-input-area">
          <pre class="editor-highlight" id="editor-highlight" aria-hidden="true"><code></code></pre>
          <textarea id="code-input" class="editor-textarea" spellcheck="false" autocomplete="off" autocorrect="off"
            autocapitalize="off" placeholder="여기에 React / React Native 코드를 붙여넣으세요...&#10;&#10;Ctrl+Enter 로 분석 실행"
            aria-label="코드 입력 에디터"></textarea>
        </div>
      </div>
    </section>

    <!-- Resizer -->
    <div id="panel-resizer" class="resizer" role="separator" aria-orientation="vertical" tabindex="0"></div>

    <!-- Right: Analysis Results -->
    <section id="panel-result" class="panel panel--result" aria-label="분석 결과">
      <!-- Tabs -->
      <nav class="tabs" role="tablist" aria-label="분석 탭">
        <button role="tab" class="tab active" data-tab="highlight" aria-selected="true" id="tab-highlight">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
            <path
              d="M1 2a1 1 0 011-1h10a1 1 0 011 1v10a1 1 0 01-1 1H2a1 1 0 01-1-1V2zm1.5.5v9h9v-9h-9zM4 4h2v1H4V4zm0 2h6v1H4V6zm0 2h4v1H4V8z" />
          </svg>
          하이라이트
        </button>
        <button role="tab" class="tab" data-tab="structure" aria-selected="false" id="tab-structure">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
            <path d="M2 1h3v3H2V1zm0 5h3v3H2V6zm7-5h3v3H9V1zm0 5h3v3H9V6zM2 11h3v2H2v-2zm7 0h3v2H9v-2zM6 2.5h3M6 7.5h3"
              stroke="currentColor" stroke-width="1" />
          </svg>
          구조맵
        </button>
        <button role="tab" class="tab" data-tab="metrics" aria-selected="false" id="tab-metrics">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
            <rect x="1" y="8" width="3" height="5" rx=".5" />
            <rect x="5.5" y="5" width="3" height="8" rx=".5" />
            <rect x="10" y="2" width="3" height="11" rx=".5" />
          </svg>
          메트릭
        </button>
        <button role="tab" class="tab" data-tab="flow" aria-selected="false" id="tab-flow">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
            <circle cx="3" cy="3" r="2" />
            <circle cx="11" cy="3" r="2" />
            <circle cx="7" cy="11" r="2" />
            <path d="M4.5 4.5L7 9M9.5 4.5L7 9" stroke="currentColor" stroke-width="1" />
          </svg>
          플로우
        </button>
        <button role="tab" class="tab" data-tab="behavior" aria-selected="false" id="tab-behavior">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v4M7 9v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M4.5 3.5L7 1l2.5 2.5M4.5 10.5L7 13l2.5-2.5" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="7" cy="7" r="2" fill="currentColor" />
          </svg>
          동작
        </button>
        <div class="tab-indicator" id="tab-indicator"></div>
      </nav>

      <!-- Tab Panels -->
      <div class="tab-panels">
        <div role="tabpanel" id="panel-highlight" class="tab-panel active" aria-labelledby="tab-highlight">
          <div class="placeholder-msg">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" opacity="0.3">
              <rect x="6" y="6" width="36" height="36" rx="8" stroke="currentColor" stroke-width="2" />
              <path d="M14 18h8M14 24h16M14 30h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <p>왼쪽에 코드를 입력하고 <strong>분석하기</strong>를 클릭하세요</p>
            <span class="placeholder-shortcut">Ctrl + Enter</span>
          </div>
        </div>
        <div role="tabpanel" id="panel-structure" class="tab-panel" aria-labelledby="tab-structure" hidden>
          <div class="placeholder-msg">
            <p>분석 결과가 여기에 표시됩니다</p>
          </div>
        </div>
        <div role="tabpanel" id="panel-metrics" class="tab-panel" aria-labelledby="tab-metrics" hidden>
          <div class="placeholder-msg">
            <p>분석 결과가 여기에 표시됩니다</p>
          </div>
        </div>
        <div role="tabpanel" id="panel-flow" class="tab-panel" aria-labelledby="tab-flow" hidden>
          <div class="placeholder-msg">
            <p>분석 결과가 여기에 표시됩니다</p>
          </div>
        </div>
        <div role="tabpanel" id="panel-behavior" class="tab-panel" aria-labelledby="tab-behavior" hidden>
          <div class="placeholder-msg">
            <p>이벤트를 눌렀을 때 무슨 일이 일어나는지 보여줍니다</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Status Bar -->
  <footer id="app-status" class="statusbar">
    <span id="status-lines" class="statusbar__item">줄: 0</span>
    <span id="status-functions" class="statusbar__item">함수: 0</span>
    <span id="status-components" class="statusbar__item">컴포넌트: 0</span>
    <span id="status-hooks" class="statusbar__item">Hook: 0</span>
    <span id="status-imports" class="statusbar__item">Import: 0</span>
    <span class="statusbar__spacer"></span>
    <span id="status-lang" class="statusbar__item statusbar__item--right">JSX</span>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
